  products:
    - name: ZaiNar Physical AI Platform
      description: Software layer that synchronizes wireless networks to
        sub-nanosecond precision and computes sub-meter 3D location of any
        radio-emitting device without GPS or new hardware.
    - name: Healthcare Asset & Device Tracking
      description: Real-time location of medical equipment and staff in
        hospitals to cut the 20-30% of clinician time spent searching for
        devices.
    - name: Construction Safety & Progress Monitoring
      description: Live tracking of workers and equipment with dynamic safety
        geofencing and automated build-progress capture on active job sites.
    - name: Smart City & GX Solutions
      description: Urban spatial-awareness deployments anchored by ZaiNar's
        Tokyo Metropolitan Government GX Innovation Program engagement.
    - name: Industrial IoT Positioning
      description: Sub-meter indoor/outdoor tracking for factories, logistics
        yards, and autonomous-vehicle coordination over existing Wi-Fi and 5G.
    - name: Terrestrial GPS Backup / PNT
      description: Network-computed Positioning, Navigation, and Timing that
        functions indoors, through walls, and in GPS-denied environments.
