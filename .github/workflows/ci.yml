name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quick:
    name: Quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint Python
        run: |
          uv run ruff check server scripts tests
          uv run ruff check --select E4,E7,E9,F \
            server/hypothesis_store.py \
            server/hypothesis_cycle.py \
            tests/test_hypothesis_store.py \
            tests/test_hypothesis_cycle.py

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Unit tests
        run: |
          python -m pytest tests/test_hypothesis_store.py tests/test_hypothesis_cycle.py
          npm --prefix frontend test

  full:
    name: Full
    runs-on: ubuntu-latest
    needs: quick
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Quality gate
        run: scripts/quality.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
