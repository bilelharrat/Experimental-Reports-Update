name: BSHResearch
options:
  bundleIdPrefix: com.bsh
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  BASE_URL: "http://127.0.0.1:8010"
  SWIFT_VERSION: "5.10"
  # Free personal team (Bilel Harrat). Survives `xcodegen generate`.
  # Push Notifications are NOT supported on personal teams — do not add
  # aps-environment until a paid Apple Developer Program team is used.
  DEVELOPMENT_TEAM: 8CV4X23Y2T
  CODE_SIGN_STYLE: Automatic

targets:
  BSHResearch:
    type: application
    platform: iOS
    sources:
      - path: BSHResearch
    dependencies:
      - target: BSHResearchWidgets
      - target: BSHResearchWatch
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bilelharrrat.bshresearch
      INFOPLIST_FILE: BSHResearch/Info.plist
      CODE_SIGN_ENTITLEMENTS: BSHResearch/BSHResearch.entitlements
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BSHResearch/Info.plist
      properties:
        CFBundleDisplayName: BSH Research
        # Default API origin = the Mac's LAN IP so physical devices work out
        # of the box (simulator reaches it too). Overridable in Settings tab.
        BSHBaseURL: http://192.168.1.181:8010
        NSLocalNetworkUsageDescription: Connects to your BSH Research server on the local network.
        NSSpeechRecognitionUsageDescription: Dictates questions for Ask Warren.
        NSMicrophoneUsageDescription: Records voice questions for Ask.
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.bilelharrrat.bshresearch
            CFBundleURLSchemes:
              - bshresearch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  BSHResearchWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BSHResearchWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bilelharrrat.bshresearch.widgets
      CODE_SIGN_ENTITLEMENTS: BSHResearchWidgets/BSHResearchWidgets.entitlements
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: BSHResearchWidgets/Info.plist
      SKIP_INSTALL: true
    info:
      path: BSHResearchWidgets/Info.plist
      properties:
        CFBundleDisplayName: BSH Markets
        # Widget can't read the app's Settings override, so point it at the
        # Mac's LAN IP for physical-device testing (works on simulator too).
        BSHBaseURL: http://192.168.1.181:8010
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BSHResearchWatch:
    type: application
    platform: watchOS
    sources:
      - path: BSHResearchWatch
        excludes:
          - "**/*.md"
    dependencies:
      - target: BSHResearchWatchWidgets
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bilelharrrat.bshresearch.watchkitapp
      INFOPLIST_FILE: BSHResearchWatch/Info.plist
      CODE_SIGN_ENTITLEMENTS: BSHResearchWatch/BSHResearchWatch.entitlements
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      # Empty placeholder icon is fine for simulator; avoid hard AppIcon failure.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: NO
    info:
      path: BSHResearchWatch/Info.plist
      properties:
        CFBundleDisplayName: BSH
        WKCompanionAppBundleIdentifier: com.bilelharrrat.bshresearch
        WKRunsIndependentlyOfCompanionApp: true
        BSHBaseURL: http://192.168.1.181:8010
        NSLocalNetworkUsageDescription: Connects to your BSH Research server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        WKApplication: true
  BSHResearchWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: BSHResearchWatchWidgets
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bilelharrrat.bshresearch.watchkitapp.widgets
      INFOPLIST_FILE: BSHResearchWatchWidgets/Info.plist
      CODE_SIGN_ENTITLEMENTS: BSHResearchWatchWidgets/BSHResearchWatchWidgets.entitlements
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      GENERATE_INFOPLIST_FILE: false
      SKIP_INSTALL: true
      SDKROOT: watchos
      TARGETED_DEVICE_FAMILY: "4"
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: BSHResearchWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: BSH Face
        BSHBaseURL: http://192.168.1.181:8010
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BSHResearchMac:
    type: application
    platform: macOS
    sources:
      - path: BSHResearchMac
        excludes:
          - "**/*.md"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: Charts.framework
      - sdk: PDFKit.framework
      - sdk: QuickLookUI.framework
      - sdk: QuickLook.framework
      - sdk: WebKit.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bilelharrrat.bshresearch.mac
      INFOPLIST_FILE: BSHResearchMac/Info.plist
      CODE_SIGN_ENTITLEMENTS: BSHResearchMac/BSHResearchMac.entitlements
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      GENERATE_INFOPLIST_FILE: false
      SDKROOT: macosx
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_HARDENED_RUNTIME: true
      COMBINE_HIDPI_IMAGES: true
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: BSHResearchMac/Info.plist
      properties:
        CFBundleDisplayName: BSH Research
        LSApplicationCategoryType: public.app-category.finance
        BSHBaseURL: http://127.0.0.1:8010
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
  BSHResearchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BSHResearchTests
    dependencies:
      - target: BSHResearch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bilelharrrat.bshresearch.tests
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: true
schemes:
  BSHResearch:
    build:
      targets:
        BSHResearch: all
        BSHResearchWatch: all
        BSHResearchTests: [test]
    test:
      targets:
        - BSHResearchTests
  BSHResearchWatch:
    build:
      targets:
        BSHResearchWatch: all
    run:
      config: Debug
  BSHResearchMac:
    build:
      targets:
        BSHResearchMac: all
    run:
      config: Debug
