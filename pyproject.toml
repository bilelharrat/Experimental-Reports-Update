[project]
name = "bsh-research-center"
version = "0.1.0"
description = "BSH Research Center — company research dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0.2",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
    "e2e: real-Claude end-to-end tests; skipped by default (run with `pytest -m e2e`)",
]
asyncio_mode = "auto"
