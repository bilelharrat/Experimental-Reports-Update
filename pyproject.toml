[project]
name = "bsh-research-center"
version = "0.1.0"
description = "BSH Research Center — company research dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0.2",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
    "e2e: real-Claude end-to-end tests; skipped by default (run with `pytest -m e2e`)",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "data",
    "frontend",
    "pres",
]

[tool.ruff.lint]
# The repository-wide gate starts with parse/syntax safety. Broader pyflakes
# cleanup and full formatting are applied to new hypothesis files first because
# existing modules still contain known unused imports and wide prose fixtures.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# server/api.py keeps StreamingResponse imports local to SSE endpoints.
"server/api.py" = ["F821"]

[tool.ruff.format]
quote-style = "preserve"
