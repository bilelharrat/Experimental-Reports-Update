<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <title>BSH Research Center</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <!-- Appearance is resolved before first paint so the light default is
         applied immediately. Mirrors the logic in src/appearance.js. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("bsh.research.appearance");
          var dark =
            saved === "dark" ||
            (saved === "auto" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode / storage disabled — fall back to light */
        }
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
