<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <title>BSH Research Center</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f1f1a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d0b" />
    <!-- Appearance is resolved before first paint so there is no flash.
         Follows the system unless Settings chose Light or Dark. Mirrors
         the logic in src/appearance.js. -->
    <script>
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem("bsh.research.appearance");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches;
          dark = saved === "dark" || (saved !== "light" && system);
        } catch (e) {
          /* private mode / storage disabled — follow the system if we can */
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (err) {
            dark = false;
          }
        }
        if (dark) document.documentElement.classList.add("dark");
        // The design (Bureau unless Settings chose Folio or Summit Glass).
        // Mirrors src/design.js.
        var design = "bureau";
        try {
          var chosen = localStorage.getItem("bsh.research.design");
          if (chosen === "folio" || chosen === "glass") design = chosen;
        } catch (e) {
          /* storage disabled — the default design */
        }
        document.documentElement.setAttribute("data-design", design);
        // The browser chrome takes the design's ground from the first paint.
        var ground = {
          bureau: ["#0f1f1a", "#080d0b"],
          folio: ["#f4f2ed", "#161513"],
          glass: ["#f4f4f6", "#111113"],
        }[design];
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          var isDark = (metas[i].getAttribute("media") || "").indexOf("dark") !== -1;
          metas[i].setAttribute("content", isDark ? ground[1] : ground[0]);
        }
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
